<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0; 
      padding: 10px; 
      background: #1e1e1e; 
      color: white; 
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      gap: 10px; /* Отступ между элементами */
    }
    button {
      width: 100%;
      height: 40px;
      cursor: pointer;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      flex-shrink: 0; /* Чтобы кнопка не сжималась */
    }
    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      background: #555;
      outline: none;
      height: 8px;
      border-radius: 5px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      background: #4f46e5;
      cursor: pointer;
      border-radius: 50%;
      border: 2px solid #fff;
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: #4f46e5;
      cursor: pointer;
      border-radius: 50%;
      border: 2px solid #fff;
    }
    .slider-label {
        font-size: 0.9em;
        display: flex;
        justify-content: space-between;
    }
    .checkbox-container {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.9em;
        margin-top: -5px;
        margin-bottom: 5px;
    }
    #deckLocationDisplay {
        font-size: 0.8em;
        color: #a0a0a0;
        margin-top: -5px;
        margin-bottom: 5px;
    }
  </style>
</head>
<body>

  <button id="shuffle">
    Перемешать карты
  </button>
  
  <div class="checkbox-container">
    <input type="checkbox" id="rememberDeckLocation">
    <label for="rememberDeckLocation">Запомнить / Использовать место колоды</label>
  </div>
  <div id="deckLocationDisplay">Место колоды не задано</div>

  <div class="slider-container">
    <div class="slider-label">
        <span>Отступ карт:</span> 
        <span id="offsetValue"></span>
    </div>
    <input type="range" id="offsetSlider" min="0" max="20" value="4">
  </div>

  <script type="module" src="./main.js"></script>

</body>
</html>
